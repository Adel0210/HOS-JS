<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hands Off Shipping — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f3f0ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% -10%, rgba(111,0,220,0.18) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 52px 44px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 12px 60px rgba(100,0,200,0.12);
      text-align: center;
      position: relative;
      z-index: 1;
      animation: pop 0.5s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo { width: 200px; margin: 0 auto 28px; display: block; border-radius: 10px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #f3f0ff;
      border: 1.5px solid #d6caff;
      border-radius: 100px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 500;
      color: #7c3aed;
      margin-bottom: 20px;
    }

    .dot {
      width: 7px; height: 7px;
      background: #7c00ff;
      border-radius: 50%;
      animation: blink 1.8s ease-in-out infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    p.sub {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .cd-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 12px;
    }

    .countdown {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 36px;
    }

    .cd-block {
      background: #f3f0ff;
      border: 1.5px solid #d6caff;
      border-radius: 12px;
      padding: 14px 16px;
      min-width: 70px;
    }

    .cd-num {
      display: block;
      font-size: 30px;
      font-weight: 700;
      color: #6f00cc;
      line-height: 1;
    }

    .cd-unit {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-top: 4px;
    }

    hr { border: none; border-top: 1px solid #f0eaff; margin-bottom: 28px; }

    .cta-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 14px;
    }

    .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      text-decoration: none;
      transition: all 0.18s;
    }

    .btn-call {
      background: #6f00cc;
      color: #fff;
      box-shadow: 0 4px 18px rgba(111,0,204,0.3);
    }

    .btn-call:hover { background: #5800a8; transform: translateY(-1px); }

    .btn-email {
      background: #f3f0ff;
      color: #6f00cc;
      border: 1.5px solid #d6caff;
    }

    .btn-email:hover { background: #e8e0ff; transform: translateY(-1px); }

    @media (max-width: 420px) {
      .card { padding: 36px 20px; }
      .cd-block { min-width: 58px; padding: 10px 10px; }
      .cd-num { font-size: 24px; }
      .btns { flex-direction: column; }
      .btn { justify-content: center; }
    }
  </style>
</head>
